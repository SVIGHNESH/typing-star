<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <radialGradient id="leaf" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#55c878" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#55c878" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f4cd3a" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#f4cd3a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="keyFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d7ffe2" stop-opacity=".06"/>
      <stop offset="100%" stop-color="#d7ffe2" stop-opacity=".015"/>
    </linearGradient>
  </defs>
  <circle cx="1500" cy="120" r="400" fill="url(#leaf)"/>
  <circle cx="120" cy="900" r="380" fill="url(#sun)"/>

  <!-- home row keycaps -->
  <g transform="translate(330 660)" fill="url(#keyFace)" stroke="#9fe3b4" stroke-opacity=".16">
