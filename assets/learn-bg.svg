      <rect x="0" y="0" width="92" height="92" rx="14"/>
      <rect x="112" y="0" width="92" height="92" rx="14"/>
      <rect x="224" y="0" width="92" height="92" rx="14"/>
      <rect x="336" y="0" width="92" height="92" rx="14"/>
      <rect x="460" y="0" width="92" height="92" rx="14"/>
      <rect x="572" y="0" width="92" height="92" rx="14"/>
      <rect x="684" y="0" width="92" height="92" rx="14"/>
      <rect x="796" y="0" width="92" height="92" rx="14"/>
