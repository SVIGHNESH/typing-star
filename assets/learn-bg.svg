  <g font-family="Courier New, monospace" font-weight="700" fill="#9fe3b4" fill-opacity=".13">
    <text x="372" y="716" font-size="42" transform="rotate(-6 372 716)">a</text>
    <text x="484" y="716" font-size="42" transform="rotate(-6 484 716)">s</text>
    <text x="596" y="716" font-size="42" transform="rotate(-6 596 716)">d</text>
    <text x="708" y="716" font-size="42" transform="rotate(-6 708 716)">f</text>
    <text x="832" y="716" font-size="42" transform="rotate(-6 832 716)">j</text>
    <text x="944" y="716" font-size="42" transform="rotate(-6 944 716)">k</text>
