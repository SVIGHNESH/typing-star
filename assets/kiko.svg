<svg xmlns="http://www.w3.org/2000/svg" width="240" height="260" viewBox="0 0 240 260">
  <defs>
    <linearGradient id="suit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a4a7a"/>
      <stop offset="100%" stop-color="#232c4d"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f4cd3a"/>
      <stop offset="100%" stop-color="#e0a91f"/>
    </linearGradient>
  </defs>

  <!-- speed lines -->
  <g stroke="#f4cd3a" stroke-opacity=".28" stroke-width="4" stroke-linecap="round">
    <line x1="8" y1="120" x2="44" y2="120"/>
    <line x1="2" y1="146" x2="34" y2="146"/>
    <line x1="18" y1="172" x2="48" y2="172"/>
  </g>

  <!-- scarf tails -->
  <path d="M 74 104 C 42 112, 30 138, 12 130 C 30 152, 52 142, 76 124 Z" fill="#d84e4a"/>
  <path d="M 74 108 C 50 128, 44 154, 24 154 C 44 170, 66 150, 80 130 Z" fill="#b63c39"/>

  <!-- legs -->
  <g stroke="#1a2038" stroke-width="6" stroke-linecap="round">
    <path d="M 100 212 L 88 246 L 66 248" fill="none"/>
    <path d="M 140 212 L 154 246 L 178 248" fill="none"/>
  </g>
  <path d="M 66 248 L 92 248 L 92 256 L 58 256 Z" rx="4" fill="#1a2038"/>
  <path d="M 152 248 L 180 248 L 186 256 L 146 256 Z" rx="4" fill="#1a2038"/>

  <!-- body -->
  <path d="M 92 128 C 92 118, 148 118, 148 128 L 155 208 C 140 220, 100 220, 85 208 Z" fill="url(#suit)" stroke="#1a2038" stroke-width="5" stroke-linejoin="round"/>
  <!-- belt -->
  <path d="M 88 188 C 110 198, 132 198, 152 188 L 154 202 C 132 212, 108 212, 86 202 Z" fill="url(#band)" stroke="#1a2038" stroke-width="4"/>
  <circle cx="120" cy="199" r="7" fill="#f5f0e1" stroke="#1a2038" stroke-width="3"/>

  <!-- arms -->
  <path d="M 92 138 C 74 146, 62 164, 58 184" fill="none" stroke="#1a2038" stroke-width="17" stroke-linecap="round"/>
  <path d="M 92 138 C 74 146, 62 164, 58 184" fill="none" stroke="#3a4a7a" stroke-width="11" stroke-linecap="round"/>
  <path d="M 148 138 C 168 150, 178 170, 184 190" fill="none" stroke="#1a2038" stroke-width="17" stroke-linecap="round"/>
  <path d="M 148 138 C 168 150, 178 170, 184 190" fill="none" stroke="#3a4a7a" stroke-width="11" stroke-linecap="round"/>
  <circle cx="58" cy="188" r="10" fill="#f2c9a3" stroke="#1a2038" stroke-width="4"/>
  <circle cx="185" cy="193" r="10" fill="#f2c9a3" stroke="#1a2038" stroke-width="4"/>

  <!-- key sword -->
  <g transform="rotate(28 185 193)">
    <rect x="180" y="146" width="10" height="50" rx="3" fill="#f4cd3a" stroke="#1a2038" stroke-width="3"/>
    <circle cx="185" cy="144" r="10" fill="none" stroke="#f4cd3a" stroke-width="8"/>
    <rect x="174" y="192" width="22" height="8" rx="3" fill="#e0a91f" stroke="#1a2038" stroke-width="3"/>
  </g>

  <!-- head -->
  <circle cx="120" cy="80" r="54" fill="#f2c9a3" stroke="#1a2038" stroke-width="5"/>
  <!-- mask -->
  <path d="M 67 84 C 67 120, 90 136, 120 136 C 150 136, 173 120, 173 84 C 155 96, 140 100, 120 100 C 100 100, 85 96, 67 84 Z" fill="url(#suit)" stroke="#1a2038" stroke-width="5"/>
  <!-- eyes -->
  <g>
    <ellipse cx="99" cy="74" rx="14" ry="16" fill="#fffefa" stroke="#1a2038" stroke-width="4"/>
    <ellipse cx="141" cy="74" rx="14" ry="16" fill="#fffefa" stroke="#1a2038" stroke-width="4"/>
    <circle cx="102" cy="76" r="6.5" fill="#1a2038"/>
    <circle cx="144" cy="76" r="6.5" fill="#1a2038"/>
    <circle cx="104" cy="73" r="2.2" fill="#fffefa"/>
    <circle cx="146" cy="73" r="2.2" fill="#fffefa"/>
  </g>
  <!-- headband -->
  <path d="M 66 50 C 92 36, 148 36, 174 50 L 176 66 C 148 54, 92 54, 64 66 Z" fill="url(#band)" stroke="#1a2038" stroke-width="4"/>
  <circle cx="120" cy="51" r="8" fill="#f5f0e1" stroke="#1a2038" stroke-width="4"/>
  <path d="M 120 51 l -10 -4 M 120 51 l 10 -4 M 120 51 l 0 10" stroke="#1a2038" stroke-width="3" stroke-linecap="round"/>
  <!-- blush -->
  <circle cx="80" cy="100" r="8" fill="#ef8a87" opacity=".55"/>
  <circle cx="160" cy="100" r="8" fill="#ef8a87" opacity=".55"/>
</svg>
