<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f4cd3a" stop-opacity=".34"/>
      <stop offset="60%" stop-color="#f4cd3a" stop-opacity=".06"/>
      <stop offset="100%" stop-color="#f4cd3a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#718ca4" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#718ca4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141510"/>
      <stop offset="55%" stop-color="#101110"/>
      <stop offset="100%" stop-color="#0a0b09"/>
    </linearGradient>
    <linearGradient id="keyFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2b24"/>
      <stop offset="100%" stop-color="#1a1b16"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#f5f0e1" stroke-opacity=".035" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="softer" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#base)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>

  <circle cx="310" cy="190" r="330" fill="url(#glowA)"/>
  <circle cx="1300" cy="760" r="420" fill="url(#glowA)" opacity=".55"/>
  <circle cx="1080" cy="200" r="340" fill="url(#glowB)"/>
  <circle cx="220" cy="820" r="300" fill="url(#glowB)" opacity=".7"/>

  <g opacity=".22" filter="url(#softer)" fill="#f4cd3a">
    <circle cx="520" cy="300" r="8"/>
    <circle cx="860" cy="150" r="5"/>
    <circle cx="1180" cy="420" r="10"/>
    <circle cx="1390" cy="220" r="6"/>
    <circle cx="180" cy="520" r="7"/>
    <circle cx="720" cy="820" r="9"/>
    <circle cx="1460" cy="640" r="5"/>
    <circle cx="980" cy="700" r="6"/>
  </g>

  <!-- floating keycaps -->
  <g stroke="#3a3b31" stroke-width="2" opacity=".72">
    <g transform="translate(190 250) rotate(-16)" filter="url(#soft)" opacity=".5">
      <rect width="112" height="112" rx="18" fill="url(#keyFace)"/>
    </g>
    <g transform="translate(190 250) rotate(-16)">
      <rect width="112" height="112" rx="18" fill="url(#keyFace)"/>
      <rect x="8" y="8" width="96" height="96" rx="12" fill="none" stroke="#4a4b3f" stroke-opacity=".7"/>
      <text x="56" y="76" text-anchor="middle" font-family="Courier New, monospace" font-size="54" font-weight="700" fill="#f4cd3a">A</text>
    </g>

    <g transform="translate(1180 130) rotate(12)" filter="url(#soft)" opacity=".45">
      <rect width="96" height="96" rx="16" fill="url(#keyFace)"/>
    </g>
    <g transform="translate(1180 130) rotate(12)">
      <rect width="96" height="96" rx="16" fill="url(#keyFace)"/>
      <text x="48" y="66" text-anchor="middle" font-family="Courier New, monospace" font-size="46" font-weight="700" fill="#e8e3d2" opacity=".8">F</text>
    </g>

    <g transform="translate(1330 520) rotate(-8)" filter="url(#soft)" opacity=".4">
      <rect width="84" height="84" rx="14" fill="url(#keyFace)"/>
    </g>
    <g transform="translate(1330 520) rotate(-8)">
      <rect width="84" height="84" rx="14" fill="url(#keyFace)"/>
      <text x="42" y="58" text-anchor="middle" font-family="Courier New, monospace" font-size="40" font-weight="700" fill="#e8e3d2" opacity=".7">J</text>
    </g>

    <g transform="translate(700 790) rotate(14)" filter="url(#soft)" opacity=".38">
      <rect width="104" height="104" rx="17" fill="url(#keyFace)"/>
    </g>
    <g transform="translate(700 790) rotate(14)">
      <rect width="104" height="104" rx="17" fill="url(#keyFace)"/>
      <rect x="8" y="8" width="88" height="88" rx="11" fill="none" stroke="#4a4b3f" stroke-opacity=".7"/>
      <text x="52" y="70" text-anchor="middle" font-family="Courier New, monospace" font-size="50" font-weight="700" fill="#f4cd3a">;</text>
    </g>

    <g transform="translate(420 560) rotate(22)" filter="url(#soft)" opacity=".3">
      <rect width="70" height="70" rx="12" fill="url(#keyFace)"/>
    </g>
    <g transform="translate(420 560) rotate(22)">
      <rect width="70" height="70" rx="12" fill="url(#keyFace)"/>
      <text x="35" y="48" text-anchor="middle" font-family="Courier New, monospace" font-size="32" font-weight="700" fill="#e8e3d2" opacity=".55">G</text>
    </g>
  </g>

  <!-- faint drifting letters -->
  <g font-family="Courier New, monospace" font-weight="700" fill="#f5f0e1" opacity=".07">
    <text x="90" y="750" font-size="120" transform="rotate(-12 90 750)">q</text>
    <text x="980" y="900" font-size="150" transform="rotate(9 980 900)">w</text>
    <text x="1460" y="960" font-size="110" transform="rotate(-6 1460 960)">e</text>
    <text x="560" y="120" font-size="130" transform="rotate(7 560 120)">r</text>
    <text x="1520" y="330" font-size="100" transform="rotate(-15 1520 330)">t</text>
    <text x="250" y="940" font-size="140" transform="rotate(5 250 940)">y</text>
  </g>

  <path d="M -100 730 C 300 620, 560 860, 900 760 S 1400 560, 1700 700" fill="none" stroke="#f4cd3a" stroke-opacity=".08" stroke-width="2"/>
  <path d="M -100 790 C 320 690, 600 920, 950 810 S 1420 630, 1700 760" fill="none" stroke="#f5f0e1" stroke-opacity=".05" stroke-width="1.5"/>
</svg>
