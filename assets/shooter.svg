<svg xmlns="http://www.w3.org/2000/svg" width="260" height="240" viewBox="0 0 260 240">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4fb7c9"/>
      <stop offset="100%" stop-color="#2b7f96"/>
    </linearGradient>
    <linearGradient id="gun" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f4cd3a"/>
      <stop offset="100%" stop-color="#e0a91f"/>
    </linearGradient>
  </defs>

  <!-- shadow -->
  <ellipse cx="130" cy="228" rx="66" ry="10" fill="#0a0b09" opacity=".35"/>

  <!-- legs -->
  <g stroke="#1a2038" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M 100 196 L 92 222"/>
    <path d="M 152 196 L 160 222"/>
  </g>
  <path d="M 76 222 h 34 v 10 h -42 z" rx="4" fill="#1a2038"/>
  <path d="M 146 222 h 34 l 8 10 h -42 z" rx="4" fill="#1a2038"/>

  <!-- body -->
  <path d="M 92 132 C 92 120, 160 120, 160 132 L 166 200 C 148 210, 104 210, 88 200 Z" fill="url(#body)" stroke="#1a2038" stroke-width="5" stroke-linejoin="round"/>
  <rect x="93" y="164" width="68" height="14" rx="7" fill="#f5f0e1" opacity=".85" stroke="#1a2038" stroke-width="3"/>
  <circle cx="127" cy="171" r="9" fill="#f4cd3a" stroke="#1a2038" stroke-width="3"/>
  <path d="M 118 171 h 18 M 127 162 v 18" stroke="#1a2038" stroke-width="2"/>

  <!-- left arm -->
  <path d="M 94 140 C 76 150, 68 166, 68 182" fill="none" stroke="#1a2038" stroke-width="16" stroke-linecap="round"/>
  <path d="M 94 140 C 76 150, 68 166, 68 182" fill="none" stroke="#4fb7c9" stroke-width="10" stroke-linecap="round"/>
  <circle cx="68" cy="184" r="9" fill="#7fd6e6" stroke="#1a2038" stroke-width="4"/>

  <!-- gun arm raised -->
  <path d="M 158 140 C 178 132, 192 120, 200 106" fill="none" stroke="#1a2038" stroke-width="16" stroke-linecap="round"/>
  <path d="M 158 140 C 178 132, 192 120, 200 106" fill="none" stroke="#4fb7c9" stroke-width="10" stroke-linecap="round"/>
  <circle cx="201" cy="105" r="9" fill="#7fd6e6" stroke="#1a2038" stroke-width="4"/>

  <!-- pistol -->
  <g transform="rotate(-42 201 105)">
    <rect x="188" y="70" width="26" height="42" rx="6" fill="url(#gun)" stroke="#1a2038" stroke-width="4"/>
    <rect x="194" y="46" width="14" height="30" rx="4" fill="url(#gun)" stroke="#1a2038" stroke-width="4"/>
    <rect x="190" y="40" width="22" height="10" rx="4" fill="#f5f0e1" stroke="#1a2038" stroke-width="3"/>
    <rect x="196" y="104" width="12" height="20" rx="4" fill="#1a2038"/>
    <circle cx="201" cy="82" r="4" fill="#1a2038"/>
  </g>

  <!-- muzzle flash -->
  <g fill="#f4cd3a" opacity=".9">
    <path d="M 226 60 l 16 -8 -6 16 16 -2 -14 12 14 6 -18 2 8 14 -16 -8 -2 18 -6 -16 -12 12 6 -18 -18 2 14 -12 -14 -6 18 -2 z" opacity=".55"/>
  </g>

  <!-- head -->
  <circle cx="126" cy="78" r="50" fill="#7fd6e6" stroke="#1a2038" stroke-width="5"/>
  <!-- visor -->
  <path d="M 84 72 C 84 56, 168 56, 168 72 L 164 94 C 150 102, 102 102, 88 94 Z" fill="#1a2038"/>
  <path d="M 96 76 C 110 70, 142 70, 156 76" fill="none" stroke="#f4cd3a" stroke-width="4" stroke-linecap="round"/>
  <circle cx="112" cy="85" r="5" fill="#f5f0e1"/>
  <circle cx="140" cy="85" r="5" fill="#f5f0e1"/>
  <!-- antenna -->
  <line x1="126" y1="28" x2="126" y2="12" stroke="#1a2038" stroke-width="4" stroke-linecap="round"/>
  <circle cx="126" cy="10" r="6" fill="#f4cd3a" stroke="#1a2038" stroke-width="3"/>
  <!-- smile -->
  <path d="M 112 108 C 120 116, 134 116, 142 108" fill="none" stroke="#1a2038" stroke-width="4" stroke-linecap="round"/>
  <!-- cheek bolts -->
  <circle cx="82" cy="88" r="5" fill="#2b7f96" stroke="#1a2038" stroke-width="3"/>
  <circle cx="170" cy="88" r="5" fill="#2b7f96" stroke="#1a2038" stroke-width="3"/>
</svg>
